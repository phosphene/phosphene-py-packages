[project]
name = "phosphene-myths"
version = "0.1.0"
description = "Unified Myth & Cross-Domain Evidence Engine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Phosphene Team", email = "flow@ind.media" }
]
dependencies = [
    "pydantic>=2.10.6",
    "phosphene-core>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phosphene"]
