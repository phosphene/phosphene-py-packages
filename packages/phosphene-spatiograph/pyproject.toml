[project]
name = "phosphene-spatiograph"
version = "0.1.0"
description = "Canonical Spatio-Graphic Archival Engine, RO-Crate 1.1 Packaging, and CTS/CITE-2 Projection"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Edward Phillips", email = "edfaustly@gmail.com" },
    { name = "Phosphene Team", email = "flow@ind.media" }
]
dependencies = [
    "pydantic>=2.10.6",
    "phosphene-core>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-mock>=3.14.0",
    "behave>=1.2.6",
    "pymupdf>=1.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phosphene"]
