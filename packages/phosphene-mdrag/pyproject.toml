[project]
name = "phosphene-mdrag"
version = "0.1.0"
description = "Extensible Scientific Markdown Orchestration (phosphene namespace)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Edward Phillips", email = "edfaustly@gmail.com" }
]
dependencies = [
    "pydantic>=2.10.6",
    "mistune>=3.1.2",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phosphene"]
