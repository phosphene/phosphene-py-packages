[project]
name = "phosphene-imi-wordpress"
version = "1.0.0"
description = "IMI WordPress client — WPClientProtocol implementation, dry-run, CPT definitions, Docker integration tests"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "behave>=1.2", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phosphene"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "regression: regression tests for previously fixed bugs",
]
