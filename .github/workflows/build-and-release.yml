name: Build and Release Wheels

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'pkg-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build all package distributions
        run: |
          mkdir -p dist
          for pkg in packages/*; do
            if [ -f "$pkg/pyproject.toml" ]; then
              echo "=== Building $pkg ==="
              uv build --package $(basename $pkg) --out-dir dist/
            fi
          done
          ls -la dist/

      - name: Test importing built packages
        run: |
          uv venv test-env
          source test-env/bin/activate
          uv pip install dist/*.whl
          python -c "import phosphene.core; print('phosphene.core loaded successfully')"
          python -c "import phosphene.mdrag; print('phosphene.mdrag loaded successfully')"
          python -c "import phosphene.frontmatters; print('phosphene.frontmatters loaded successfully')"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels
          path: dist/*

      - name: Create Release and Upload Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
